<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>＃その求人ちょっと待って</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 真面目だけど堅すぎない、大学生が作った啓発ゲーム（お金に困っている状況を体験）
   IDEA: スマホの画面そのもの。求人投稿のタイムラインとDMの画面、割りこむ通知
   PICTURE: 投稿カードとチャット画面が主役。制限時間のバーと残高表示
   COLOUR and TYPE: 白と黒、危ないサインと時間だけ警告の赤。Zen Kaku Gothic New
   LAYOUT: スマホ幅の1列。上に進み具合のバーと残高 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e0e0e);--ink:light-dark(#141414,#f2f2f2);--sub:light-dark(#5f5f5f,#a8a8a8);--line:light-dark(#e3e3e3,#2a2a2a);--card:light-dark(#f6f6f6,#1a1a1a);--red:#e4002b;--ok:light-dark(#0a6b3d,#4fd18f);--mid:light-dark(#9a6a00,#f0b429);--me:light-dark(#141414,#f2f2f2);--meInk:light-dark(#fff,#111)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;overflow-x:clip}
.top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:3px solid var(--ink);padding:8px max(5vw,16px) 8px}
.top b{font-weight:900;letter-spacing:.02em}.top small{display:block;color:var(--sub);font-size:13px}
.top small.money{color:var(--red);font-weight:700}
.proto{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:0 8px;margin-left:6px;vertical-align:2px}
.bar{height:6px;background:var(--line);margin-top:8px;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);transition:width .4s}
main{max-width:480px;margin:0 auto;padding:14px 16px 48px}
h1{font-size:clamp(24px,6vw,30px);line-height:1.15;font-weight:900;margin:6px 0 10px;text-wrap:balance}
h1.sm{font-size:clamp(22px,6vw,28px);margin:4px 0 10px}
h2{font-size:19px;line-height:1.3;font-weight:900;margin:14px 0 6px}
p{margin:0 0 14px}.sub{color:var(--sub);font-size:14px}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--red);border:1.5px solid var(--red);border-radius:99px;padding:1px 10px}
.tag.mid{color:var(--mid);border-color:var(--mid)}
.btn{display:block;width:100%;min-height:48px;margin:8px 0 0;border:2px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--bg);font-family:inherit;font-weight:700;font-size:17px;line-height:1.3;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.row.six{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.row button{min-height:52px;border:2px solid var(--ink);border-radius:12px;background:transparent;color:var(--ink);font-family:inherit;font-weight:900;font-size:20px;cursor:pointer}
.row button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.post{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card);margin:6px 0 4px;line-height:1.55}
.who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900}
.who b{display:block;line-height:1.2}.who span{font-size:13px;color:var(--sub)}
.post .txt{white-space:pre-wrap;margin:0}
.search{font-size:13px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:6px 14px;margin-bottom:8px}
.res{border-left:4px solid var(--ok);padding:8px 12px;margin:10px 0;background:var(--card);border-radius:0 10px 10px 0}
.res.bad{border-color:var(--red)}.res.mid{border-color:var(--mid)}
.chat{border:1px solid var(--line);border-radius:18px;padding:10px;background:var(--card);display:flex;flex-direction:column;gap:6px;margin:6px 0}
.chat .head{font-size:13px;color:var(--sub);text-align:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.msg{max-width:85%;padding:6px 11px;line-height:1.5;border-radius:16px;background:var(--bg);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;animation:pop .35s ease-out both}
.msg.me{align-self:flex-end;background:var(--me);color:var(--meInk);border-color:var(--me)}
.msg.sys{align-self:center;background:transparent;border:0;color:var(--sub);font-size:13px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.timer{margin:10px 0 2px}.timer .t{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--red)}
.timer .tb{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.timer .tb i{display:block;height:100%;width:100%;background:var(--red)}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);width:min(440px,calc(100% - 20px));z-index:5;background:var(--red);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:16px;font-weight:700;line-height:1.45;display:flex;gap:10px;align-items:center;animation:drop .35s ease-out both,shake .5s .35s ease-in-out}
.toast .ic{flex:none;width:36px;height:36px;border-radius:10px;background:#fff;color:var(--red);display:grid;place-items:center}
.toast b{display:block;font-size:13px;font-weight:700;opacity:.9}
@keyframes drop{from{opacity:0;transform:translate(-50%,-16px)}}
@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
.status{border:2px solid var(--red);border-radius:16px;padding:12px 14px;margin:10px 0}.status .big{font-size:36px;font-weight:900;line-height:1.1;color:var(--red)}
@media(prefers-reduced-motion:reduce){.msg,.toast{animation:none}.bar i{transition:none}}
.stop{background:var(--red);color:#fff;border-radius:20px;padding:28px 20px;text-align:center}
.stop h1{color:#fff;font-size:clamp(36px,10vw,52px);margin:0 0 10px}
.signs{list-style:none;padding:0;margin:0;counter-reset:s}
.signs li{counter-increment:s;padding:6px 0 6px 34px;position:relative;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.signs li::before{content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
.signs small{color:var(--sub);font-size:13px}
.call{border:3px solid var(--ink);border-radius:18px;padding:16px;text-align:center;margin:20px 0}
.call strong{display:block;font-size:44px;font-weight:900;line-height:1.1}
.call.sm{padding:10px 12px;margin:12px 0;font-size:14px}
.cmp{display:grid;gap:6px;margin:8px 0}
.cmp .lab{display:flex;justify-content:space-between;font-weight:700}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ink)}
.meter.after i{background:var(--red)}
.score{font-size:14px;border-top:1px solid var(--line);padding-top:8px}.score p{margin:0 0 4px}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.tally div{border:2px solid var(--ok);border-radius:12px;text-align:center;padding:6px 4px;font-size:13px;font-weight:700}
.tally div.mid{border-color:var(--mid)}.tally div.bad{border-color:var(--red)}
.tally strong{display:block;font-size:26px;font-weight:900;line-height:1.1}
.note{font-size:13px;color:var(--sub);border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.note a{color:inherit}.note summary{cursor:pointer;min-height:32px;line-height:32px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.grid4 .btn{margin:0;font-size:22px;font-weight:900}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ng{background:var(--red);border-color:var(--red);color:#fff}
.team{border:1px dashed var(--sub);border-radius:12px;padding:8px 12px;margin:14px 0 0;font-size:14px}
.team label{display:flex;gap:10px;align-items:center;min-height:40px;cursor:pointer}
.team input{width:20px;height:20px;accent-color:var(--red);flex:none}
</style>
</head>
<body>

/* 問題を見ている途中に割りこむ通知（問題ごとに1つ） */
const NOTE=[{from:'カード会社',t:'お支払い期限は明日です。'},{from:'大家さん',t:'今月の家賃の振込、まだ確認できていません。'},{from:'みさき',t:'今週の飲み会来るよね？会費4,000円！'},{from:'携帯会社',t:'料金のお支払いが確認できていません。'},{from:'銀行',t:'口座の残高が少なくなっています。'},{from:'お母さん',t:'今月の仕送り、少し遅れそう。ごめんね'}];
const VIDEO=[{s:'sys',t:'テレグラムに移動しました'},{s:'them',t:'本人確認のため、身分証と顔写真を送ってください。'},{s:'me',t:'（身分証と顔写真を送信）'},{s:'them',t:'確認しました。明日、指定の場所で荷物を受け取ってください。'},{s:'me',t:'やっぱり怖いので、やめたいです。'},{s:'them',t:'身分証で住所はわかってるよ。\n家に行くことになるけど、いいの？'},{s:'sys',t:'ここから抜け出すのは、とても難しい'}];
const NUMS=['#9101','#9110','#1190','#9910'];
/* 結果の分け方。正解／迷った／不正解 */
const LAB={ok:'正解',timeout:'時間切れ',back:'応募しかけた',miss:'不正解',fell:'進んでしまった'};
const KIND={ok:'ok',timeout:'mid',back:'mid',miss:'bad',fell:'bad'};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bubbles=l=>l.map(m=>`<div class="msg ${m.s==='me'?'me':m.s==='sys'?'sys':''}">${esc(m.t)}</div>`).join('');
const post=q=>`${q.kind==='search'?`<div class="search">検索：${esc(q.q)}</div>`:''}<article class="post"><div class="who"><div class="av">${q.av}</div><div><b>${esc(q.name)}</b><span>${esc(q.id)}</span></div></div><p class="txt">${esc(q.text)}</p></article>`;
const P=i=>14+Math.round(i*62/Q.length);
const $=s=>app.querySelector(s);
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const goEnd=el=>{if(!el)return;el.scrollIntoView({block:'end',behavior:reduce()?'auto':'smooth'})};
const count=k=>S.out.filter(o=>KIND[o]===k).length;
function clear(){S.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});S.timers=[];document.querySelectorAll('.toast').forEach(t=>t.remove())}
function set(p,html){clear();bar.style.width=p+'%';app.innerHTML=html;window.scrollTo(0,0)}
function pick(nums,cls,aria,label,ends,next){return `<p>${label}</p><div class="row ${cls}" role="group" aria-label="${aria}">${nums.map(n=>`<button data-n="${n}" aria-pressed="false">${n}</button>`).join('')}</div>${ends}<button class="btn" id="next" disabled>${next}</button>`}
const scale=(label,next)=>pick([1,2,3,4,5],'','自信の度合い',label,'<div class="ends"><span>まったくない</span><span>すごくある</span></div>',next);
function bindPick(key,onNext){const b=[...app.querySelectorAll('.row button')],nx=$('#next');b.forEach(x=>x.onclick=()=>{b.forEach(y=>y.setAttribute('aria-pressed','false'));x.setAttribute('aria-pressed','true');S[key]=+x.dataset.n;nx.disabled=false});nx.onclick=onNext}
function play(box,list,done){list.forEach((m,k)=>S.timers.push(setTimeout(()=>{box.insertAdjacentHTML('beforeend',bubbles([m]));goEnd(box.lastElementChild);if(k===list.length-1)done()},reduce()?0:900+k*1400)))}
function nextBtn(){const nx=document.createElement('button');nx.className='btn';nx.textContent=S.i<Q.length-1?'次の問題へ':'結果へ';nx.onclick=()=>S.i<Q.length-1?quiz(S.i+1):afterQuiz();app.appendChild(nx);nx.focus({preventScroll:true});goEnd(nx)}
function strip(){app.querySelectorAll('#timer,#a,#p').forEach(b=>b.remove())}

/* 制限時間と通知 */
function startTimer(sec,onEnd){const box=$('#timer');if(!box)return;const lab=box.querySelector('.left'),bi=box.querySelector('.tb i'),start=Date.now();
 const tick=()=>{const left=Math.max(0,sec-(Date.now()-start)/1000);lab.textContent=`あと${Math.ceil(left)}秒`;bi.style.width=(left/sec*100)+'%';if(left<=0){clearInterval(id);onEnd()}};
 const id=setInterval(tick,100);S.timers.push(id);tick()}
function toast(n){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML=`<span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3a1.5 1.5 0 0 0-3 0v1.2A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg></span><span><b>${esc(n.from)}</b>${esc(n.t)}</span>`;document.body.appendChild(d);S.timers.push(setTimeout(()=>d.remove(),4500))}
const timerBox=lab=>`<div class="timer" id="timer"><div class="t"><span>${lab}</span><span class="left"></span></div><div class="tb"><i></i></div></div>`;

function reveal(){
 sub.textContent='体験ゲーム';sub.className='';
 set(3,`<span class="tag">はじめに</span><h1>その求人、大丈夫？</h1><p>SNSや検索で見つけた求人を見ながら、制限時間内に「応募する／やめておく」を選んでいくゲームです。お金に困っている状況のつもりで、闇バイトを見抜けるか試してみてください。</p><div class="call">怪しいと思ったら、ここに相談<strong>#9110</strong>警察相談専用電話</div><button class="btn" id="go">ゲームをはじめる</button>`);
 $('#go').onclick=()=>{S.id=newId();S.sent=false;conf1()}}
function conf1(){set(6,`<span class="tag">はじめに</span><h1>あなたは闇バイトを見抜ける自信がある？</h1>${scale('1〜5で選んでね','次へ')}`);bindPick('c1',guess)}
/* 最初に何問正解できるか予想してもらう */
function guess(){set(9,`<span class="tag">はじめに</span><h1>${Q.length}問のうち、何問正解できると思う？</h1>${pick([0,1,2,3,4,5],'six','正解数の予想','予想を選んでね','<p class="sub">「応募してみる」を押したら、あとで引き返しても正解にはならないよ。</p>','次へ')}`);bindPick('guess',status)}
function status(){
 set(11,`<span class="tag">あなたの状況</span><h1>今のあなたは、こんな状況。</h1><div class="status"><div class="sub">口座の残高</div><div class="big">3,200円</div></div><p>家賃の支払いまで、あと5日。スマホ代もまだ払えていない。</p><p class="sub">この状況のつもりで、求人を見ていってね。時間内に選ばないと、募集は締め切られてしまうよ。</p><button class="btn" id="go">求人を見る</button>`);
 sub.textContent='残高 3,200円｜家賃の支払いまであと5日';sub.className='money';
 $('#go').onclick=()=>quiz(0)}

function quiz(i){S.i=i;const q=Q[i];
 set(P(i),`<span class="tag">判別クイズ ${i+1} / ${Q.length}</span><h1>この求人、どうする？</h1>${post(q)}<div id="rush"></div>${timerBox('考える時間')}<button class="btn" id="a">応募してみる</button><button class="btn ghost" id="p">やめておく</button>`);
 $('#a').onclick=()=>answer(true);$('#p').onclick=()=>answer(false);
 S.timers.push(setTimeout(()=>toast(NOTE[i%NOTE.length]),3000));
 startTimer(SEC1,()=>q.danger?rush(i):closed(i))}
function rush(i){const q=Q[i];S.rushed[i]=true;
 $('#rush').innerHTML=`<div class="chat"><div class="head">DM　${esc(q.name)}</div>${bubbles(q.rush.map(t=>({s:'them',t})))}</div>`;
 $('#timer .t span').textContent='急かされている';goEnd($('#p'));
 startTimer(SEC2,()=>closed(i))}
function closed(i){const q=Q[i];clear();S.out[i]='timeout';strip();
 const box=document.createElement('div');box.className='res mid';
 box.innerHTML=q.danger?`<b>時間切れ。募集は締め切られました。（迷った）</b><br>急かされて焦った？「今日中に」「残り1枠」と急かすのは、考える時間をなくすための相手の作戦。<br><br>${esc(q.why)}`:`<b>時間切れ。募集は締め切られました。（迷った）</b><br>この求人は、DMで急かしてこなかったよね。${esc(q.why)}`;
 app.appendChild(box);nextBtn()}
function answer(apply){const i=S.i,q=Q[i];clear();strip();
 if(q.danger&&apply){dm(i);return}
 const right=q.danger!==apply;
 S.out[i]=right?'ok':'miss';if(S.out[i]==='ok')S.correct++;
 const box=document.createElement('div');box.className='res'+(right?'':' bad');
 const head=right?'○ 正解！':'× 不正解…実はこれ、普通の求人だった。';
 box.innerHTML=`<b>${head}</b><br>${esc(q.why)}${S.rushed[i]&&q.danger&&right?'<br><br>急かされても、決める前に家族や友だちに相談していい。':''}${q.dmJudge&&right?'<br><br>この求人は、投稿だけでは見分けにくいように作ってあった。怪しいサインは、応募したあとのDMで初めて出てくる。':''}`;
 app.appendChild(box);nextBtn()}

function dm(i){const q=Q[i],e=q.end;
 set(P(i)+3,`<span class="tag">判別クイズ ${i+1}・応募した</span><h1>応募したら、返事が来た。</h1><div class="chat"><div class="head">DM</div><div class="msg me">求人を見ました。応募したいです。</div>${bubbles(e.dm.map(t=>({s:'them',t})))}</div><h2>どうする？</h2><button class="btn" id="y">${esc(e.yes)}</button><button class="btn ghost" id="n">${esc(e.no)}</button>`);
 $('#y').onclick=()=>fall(i);$('#n').onclick=()=>back(i)}
/* 応募してからDMで引き返した → 「迷った」 */
function back(i){const q=Q[i],e=q.end;S.out[i]='back';
 const head=q.dmJudge
  ?`<span class="tag mid">△ 迷った</span><h1>DMで気づけた！でも…</h1><p>${esc(q.why)}</p><p>DMで気づけたのはよかった。でも、応募した時点で相手にはあなたのアカウントが知られている。だから今回は「迷った」になる。</p>`
  :`<span class="tag mid">△ 迷った</span><h1>危なかった！</h1><p>これは闇バイトの求人だった。${esc(q.why)}</p><p>応募した時点で、相手にはあなたのアカウントが知られている。個人情報を送る前にやめられたのは、ぎりぎりだった。</p>`;
 set(P(i)+6,`${head}<h2>もし「${esc(e.yes)}」を選んでいたら…</h2><div class="chat" id="vid"><div class="head">DM</div></div>`);
 play($('#vid'),e.story,()=>{const f=document.createElement('div');f.className='res bad';f.innerHTML=`<b>あと一歩で、こうなっていた。</b><br>${esc(e.fact)}`;app.appendChild(f);nextBtn()})}
function fall(i){S.out[i]='fell';const e=Q[i].end;
 set(P(i)+6,`<div class="stop"><h1>ストップ！</h1><p>危ないよ。このまま進んだら、闇バイトをすることになるよ。</p></div><h2>この先どうなるか（${esc(e.label)}）</h2><div class="chat" id="vid"><div class="head">DM</div></div>`);
 play($('#vid'),e.story,()=>{const f=document.createElement('div');f.className='res bad';f.innerHTML=`<b>これは闇バイトの求人だった。</b><br>${esc(Q[i].why)}<br><br>${esc(e.fact)}`;app.appendChild(f);const t=document.createElement('p');t.className='sub';t.textContent='ゲームはまだ続くよ。';app.appendChild(t);nextBtn()})}

function afterQuiz(){
 if(S.out.every(o=>o==='ok')){
  set(78,`<span class="tag">全問正解！</span><h1>もし応募していたら、こうなっていた。</h1><div class="chat" id="vid"><div class="head">テレグラム</div></div>`);
  play($('#vid'),VIDEO,()=>{const b=document.createElement('button');b.className='btn';b.textContent='解説へ';b.onclick=explain;app.appendChild(b);goEnd(b)})}
 else explain()}
function explain(){
 set(82,`<span class="tag">解説</span><h1 class="sm">闇バイトの危ないサイン</h1><ul class="signs"><li>「高額」「即日即金」など、楽に稼げることを強調する<small>（警察庁）</small></li><li>シグナルやテレグラムなど、匿名性の高いアプリに誘導する<small>（警察庁）</small></li><li>面接が通話だけで、会社の人に会わない<small>（茨城県警察）</small></li><li>身分証と顔写真を送らせ、脅しに使う<small>（茨城県警察、警視庁）</small></li><li>自分の口座で受け取ったお金を別の口座へ送る「送金代行」は犯罪<small>（イオン銀行、PayPay銀行）</small></li><li>夜中に決められたルートを歩かせて家の様子を記録させるなど、「下見」をさせる仕事がある<small>（愛知県警察）</small></li><li>「研修なし」の警備など、あるはずの手続きがない。見張りでも強盗と同じ罪になることがある<small>（愛知県警察、警察庁）</small></li></ul><div class="call sm">怪しいと思ったら、<b>最初に見た番号</b>にすぐ相談。家族や友だちに相談するのもOK</div><button class="btn" id="go">次へ</button>`);
 $('#go').onclick=recall}
function recall(){
 set(88,`<span class="tag">覚えてる？</span><h1>最初に見た相談先の番号はどれ？</h1><div class="grid4">${NUMS.map(n=>`<button class="btn ghost" data-n="${n}">${n}</button>`).join('')}</div>`);
 app.querySelectorAll('.grid4 button').forEach(b=>b.onclick=()=>{S.recall=b.dataset.n==='#9110';app.querySelectorAll('.grid4 button').forEach(x=>{x.disabled=true;if(x.dataset.n==='#9110')x.className='btn ok';else if(x===b)x.className='btn ng'});
  const r=document.createElement('div');r.innerHTML=`<div class="call">${S.recall?'正解！':'正解はこっち'}<strong>#9110</strong>警察相談専用電話<br><small class="sub">怪しい求人に応募してしまったときも、ここに相談できる</small></div>`;app.appendChild(r);
  const nx=document.createElement('button');nx.className='btn';nx.textContent='次へ';nx.onclick=conf2;app.appendChild(nx);nx.focus({preventScroll:true});goEnd(nx)})}
function conf2(){const n=S.out.filter(o=>o==='back'||o==='fell').length;
 set(94,`<span class="tag">もう1回</span>${n?`<div class="res bad">あなたは${Q.length}問中<b>${n}問</b>で「応募してみる」を押していた。</div>`:''}<h1>今、あなたは闇バイトを見抜ける自信がある？</h1>${scale('1〜5で選んでね','結果を見る')}`);bindPick('c2',compare)}

function vals(){return {id:S.id,c1:S.c1,c2:S.c2,guess:S.guess+'問',correct:count('ok')+'問',mid:count('mid')+'問',bad:count('bad')+'問',detail:S.out.map((o,k)=>`${k+1} ${LAB[o]}`).join('／'),recall:S.recall?'正解した':'まちがえた'}}
function record(){if(S.sent)return;S.sent=true;try{const v=vals(),b=new URLSearchParams();for(const k in RECE)b.set(RECE[k],v[k]);fetch(REC,{method:'POST',mode:'no-cors',body:b}).catch(()=>{})}catch(e){}}
function formUrl(){const p=new URLSearchParams({usp:'pp_url'});p.set(ENTRY.id,S.id);p.set(ENTRY.c1,S.c1);p.set(ENTRY.c2,S.c2);p.set(ENTRY.guess,S.guess+'問');p.set(ENTRY.correct,count('ok')+'問');p.set(ENTRY.mid,count('mid')+'問');p.set(ENTRY.bad,count('bad')+'問');p.set(ENTRY.detail,S.out.map((o,k)=>`${k+1} ${LAB[o]}`).join('／'));p.set(ENTRY.recall,S.recall?'正解した':'まちがえた');return FORM+'?'+p.toString()}
function compare(){
 record();
 const diff=S.correct-S.guess;
 const gap=diff<0?`予想より<b>${-diff}問</b>少なかった。「自分は大丈夫」と思っていても、焦っていると見抜けないことがある。`:diff>0?`予想より<b>${diff}問</b>多く正解できた！`:'予想どおりだった。';
 set(100,`<span class="tag">結果</span><h1 class="sm">予想と結果はどうだった？</h1><div class="cmp"><div><div class="lab"><span>予想した正解数</span><span>${S.guess} / ${Q.length}問</span></div><div class="meter"><i style="width:${S.guess/Q.length*100}%"></i></div></div><div><div class="lab"><span>実際の正解数</span><span>${S.correct} / ${Q.length}問</span></div><div class="meter after"><i style="width:${S.correct/Q.length*100}%"></i></div></div></div><div class="res${diff<0?' bad':''}">${gap}</div><div class="tally"><div><strong>${count('ok')}</strong>正解</div><div class="mid"><strong>${count('mid')}</strong>迷った</div><div class="bad"><strong>${count('bad')}</strong>不正解</div></div><p class="sub">${S.out.map((o,k)=>`${k+1} ${LAB[o]}`).join('／')}</p><p class="sub">「迷った」は、時間切れ・応募してからDMで引き返した問題。</p><h2>自信はどう変わった？</h2><div class="cmp"><div><div class="lab"><span>ゲーム前の自信</span><span>${S.c1} / 5</span></div><div class="meter"><i style="width:${S.c1*20}%"></i></div></div><div><div class="lab"><span>ゲーム後の自信</span><span>${S.c2} / 5</span></div><div class="meter after"><i style="width:${S.c2*20}%"></i></div></div></div><div class="score"><p>相談先の番号：${S.recall?'覚えていた':'まちがえた'}</p></div><h2>アンケートへのご協力をお願いします！</h2><p>名古屋市の課題解決の参考にさせてください。</p><div class="res">ゲームの結果は自動で入力済みです。<b>変更せずに</b>、残りの質問に答えて送信してください。</div><a class="btn" href="${formUrl()}" target="_blank" rel="noopener" style="display:grid;place-items:center;text-decoration:none">アンケートに答える</a><button class="btn ghost" id="again">最初からやり直す</button><div class="note">投稿や会社名、DMの内容はすべて架空の例。<details><summary>出典を見る</summary><a href="https://www.npa.go.jp/bureau/safetylife/yamibaito/hanzaishaboshu.html">警察庁「犯罪実行者募集情報の特徴」</a>／<a href="https://www.pref.ibaraki.jp/kenkei/a01_safety/youth/documents/2-3nashi.pdf">茨城県警察 資料</a>／<a href="https://www.keishicho.metro.tokyo.lg.jp/kurashi/drug/yami_arbeit/ban_yamiarbeit.html">警視庁「闇バイトは犯罪です」</a>／<a href="https://www.aeonbank.co.jp/crime/account/">イオン銀行</a>／<a href="https://www.paypay-bank.co.jp/security/buysell.html">PayPay銀行</a>／<a href="https://www.city.aichi-miyoshi.lg.jp/material/files/group/10/chiikianzenR6_news49.pdf">愛知県警察「地域安全ニュース」（みよし市掲載）</a>／<a href="https://www.gov-online.go.jp/npa/202411/video-289986.html">政府広報オンライン</a>／<a href="https://www.pref.aichi.jp/police/shinsei/keibi/documents/2019kyouikujikannkaisei.pdf">愛知県警察（警備員教育）</a>／<a href="https://www.npa.go.jp/hakusyo/r07/honbun/html/bbf112000.html">警察白書（令和7年版）</a>／<a href="https://www.pref.aichi.jp/police/anzen/images/siawaseGireisyuu.pdf">警察庁「闇バイトで人生を棒に振らないために」</a></details></div>`);
 $('#again').onclick=()=>{reset();reveal()}}

reveal();
}
</script>
</body>
</html>
