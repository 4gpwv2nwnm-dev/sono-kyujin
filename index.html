<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>＃その求人ちょっと待って</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 真面目だけど堅すぎない、大学生が作った啓発ゲーム
   IDEA: スマホの画面そのもの。求人投稿のタイムラインとDMの画面
   PICTURE: 投稿カードとチャット画面が主役。最初の画面から操作できる
   COLOUR and TYPE: 白と黒、危ないサインだけ警告の赤。Zen Kaku Gothic New
   LAYOUT: スマホ幅の1列。上に進み具合のバー */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e0e0e);--ink:light-dark(#141414,#f2f2f2);--sub:light-dark(#5f5f5f,#a8a8a8);--line:light-dark(#e3e3e3,#2a2a2a);--card:light-dark(#f6f6f6,#1a1a1a);--red:#e4002b;--ok:light-dark(#0a6b3d,#4fd18f);--me:light-dark(#141414,#f2f2f2);--meInk:light-dark(#fff,#111)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;overflow-x:clip}
.top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:3px solid var(--ink);padding:8px max(5vw,16px) 8px}
.top b{font-weight:900;letter-spacing:.02em}.top small{display:block;color:var(--sub);font-size:13px}
.bar{height:6px;background:var(--line);margin-top:8px;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);transition:width .4s}
main{max-width:480px;margin:0 auto;padding:14px 16px 48px}
h1{font-size:clamp(24px,6vw,30px);line-height:1.15;font-weight:900;margin:6px 0 10px;text-wrap:balance}
h2{font-size:19px;line-height:1.3;font-weight:900;margin:14px 0 6px}
p{margin:0 0 14px}.sub{color:var(--sub);font-size:14px}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--red);border:1.5px solid var(--red);border-radius:99px;padding:1px 10px}
.btn{display:block;width:100%;min-height:48px;margin:8px 0 0;border:2px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--bg);font-family:inherit;font-weight:700;font-size:17px;line-height:1.3;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.row button{min-height:52px;border:2px solid var(--ink);border-radius:12px;background:transparent;color:var(--ink);font-family:inherit;font-weight:900;font-size:20px;cursor:pointer}
.row button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.post{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card);margin:6px 0 4px;line-height:1.55}
.who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900}
.who b{display:block;line-height:1.2}.who span{font-size:13px;color:var(--sub)}
.post .txt{white-space:pre-wrap;margin:0}
.search{font-size:13px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:6px 14px;margin-bottom:8px}
.res{border-left:4px solid var(--ok);padding:8px 12px;margin:10px 0;background:var(--card);border-radius:0 10px 10px 0}
.res.bad{border-color:var(--red)}
.chat{border:1px solid var(--line);border-radius:18px;padding:10px;background:var(--card);min-height:0;display:flex;flex-direction:column;gap:6px}
.chat .head{font-size:13px;color:var(--sub);text-align:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.msg{max-width:85%;padding:6px 11px;line-height:1.5;border-radius:16px;background:var(--bg);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;animation:pop .35s ease-out both}
.msg.me{align-self:flex-end;background:var(--me);color:var(--meInk);border-color:var(--me)}
.msg.sys{align-self:center;background:transparent;border:0;color:var(--sub);font-size:13px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.msg{animation:none}.bar i{transition:none}}
.stop{background:var(--red);color:#fff;border-radius:20px;padding:28px 20px;text-align:center}
.stop h1{color:#fff;font-size:clamp(36px,10vw,52px);margin:0 0 10px}
.signs{list-style:none;padding:0;margin:0;counter-reset:s}
.signs li{counter-increment:s;padding:12px 0 12px 44px;position:relative;border-top:1px solid var(--line)}
.signs li::before{content:counter(s);position:absolute;left:0;top:12px;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}
.signs small{display:block;color:var(--sub);font-size:13px}
.call{border:3px solid var(--ink);border-radius:18px;padding:16px;text-align:center;margin:20px 0}
.call strong{display:block;font-size:44px;font-weight:900;line-height:1.1}
.cmp{display:grid;gap:12px;margin:16px 0}
.cmp .lab{display:flex;justify-content:space-between;font-weight:700}
.meter{height:22px;background:var(--line);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ink)}
.meter.after i{background:var(--red)}
.score{font-size:15px;border-top:1px solid var(--line);padding-top:12px}
fieldset{border:0;padding:0;margin:0 0 20px}legend{font-weight:700;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:6px 0;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--red)}
textarea{width:100%;min-height:96px;font-family:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.note{font-size:13px;color:var(--sub);border-top:1px solid var(--line);margin-top:28px;padding-top:12px}
.note a{color:inherit}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.grid4 .btn{margin:0;font-size:22px;font-weight:900}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ng{background:var(--red);border-color:var(--red);color:#fff}
.list{margin:0;padding-left:1.2em}.list li{margin:4px 0}
h1.sm{font-size:clamp(22px,6vw,28px);margin:4px 0 10px}
h2.sm{font-size:18px;margin:12px 0 4px}p.sm{font-size:14px;margin:0 0 6px}
.signs.mini li{padding:6px 0 6px 34px;font-size:14px;line-height:1.45}
.signs.mini li::before{width:24px;height:24px;top:7px;font-size:13px}
.signs.mini small{display:inline;font-size:13px}
.call.sm{padding:10px 12px;margin:12px 0;font-size:14px}
.cmp.sm{gap:6px;margin:8px 0}.cmp.sm .meter{height:12px}
.score.sm{padding-top:8px;font-size:14px}.score.sm p{margin:0 0 4px}
.res.sm{font-size:14px;margin:8px 0;padding:6px 10px}
.btn.sm{min-height:44px;font-size:15px;margin-top:8px}
.note.sm{margin-top:12px;padding-top:8px}.note summary{cursor:pointer;min-height:32px;line-height:32px}
</style>
</head>

 {kind:'search',q:'在宅 事務 バイト 大学生',name:'リモートワーク求人まとめ',id:'@remote_jimu_job',av:'事',

   dm:['ご応募ありがとうございます！','お仕事で使う口座の確認のため、キャッシュカードの写真とネットバンキングのIDを送ってください。'],

 {kind:'x',name:'△△ビジネスサポート 採用担当',id:'@bizsupport_recruit',av:'△',
  text:'【業務委託】書類の配達スタッフ\n1件1,500円／交通費支給・研修あり\nお客様からお預かりした書類を、指定の場所へお届けするお仕事です\n週1日・1件からOK。学生さんも活躍中！',

   yes:'身分証と顔写真を送る',no:'なんかおかしい。やめておく',

 {kind:'x',name:'スロ専 打ち子募集',id:'@uchiko_nagoya',av:'打',
  text:'パチンコ・スロットの打ち子募集！\n軍資金はこちらで用意、勝っても負けても日給1万円\n名古屋近郊で週1〜OK　詳細はDMで',
  danger:true,

  end:{label:'別アプリへの誘導',
   dm:['ご連絡ありがとうございます！','すみません、打ち子は定員になってしまいました。代わりに、もっと稼げる仕事があります。詳しくはテレグラムで説明しますね。'],

 {kind:'x',name:'セキュリティスタッフ募集',id:'@security_staff_ngy',av:'警',
  text:'【即日OK】マンションの見守りスタッフ（警備）\n日給15,000円／研修なし・未経験歓迎\n入口で来訪者を確認するだけのかんたんなお仕事\n男女ともに活躍中！\n現場の住所は当日DMでお伝えします',
  danger:true,
  why:'警備の仕事に見えるけど、「研修なし」で、現場の住所も当日まで教えない。本物の警備会社なら、働く前に研修がある。実際は強盗の見張り役だった。',

];
const VIDEO=[{s:'sys',t:'テレグラムに移動しました'},{s:'them',t:'本人確認のため、身分証と顔写真を送ってください。'},{s:'me',t:'（身分証と顔写真を送信）'},{s:'them',t:'確認しました。明日、指定の場所で荷物を受け取ってください。'},{s:'me',t:'やっぱり怖いので、やめたいです。'},{s:'them',t:'身分証で住所はわかってるよ。\n家に行くことになるけど、いいの？'},{s:'sys',t:'ここから抜け出すのは、とても難しい'}];
const NUMS=['#9101','#9110','#1190','#9910'];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bubbles=l=>l.map(m=>`<div class="msg ${m.s==='me'?'me':m.s==='sys'?'sys':''}">${esc(m.t)}</div>`).join('');
const post=q=>`${q.kind==='search'?`<div class="search">検索：${esc(q.q)}</div>`:''}<article class="post"><div class="who"><div class="av">${q.av}</div><div><b>${esc(q.name)}</b><span>${esc(q.id)}</span></div></div><p class="txt">${esc(q.text)}</p></article>`;
const $=s=>app.querySelector(s);
const goEnd=el=>{if(!el)return;const r=matchMedia('(prefers-reduced-motion: reduce)').matches;el.scrollIntoView({block:'end',behavior:r?'auto':'smooth'})};
function clear(){S.timers.forEach(clearTimeout);S.timers=[]}
function set(p,html){clear();bar.style.width=p+'%';app.innerHTML=html;window.scrollTo(0,0)}
function scale(label,next){return `<p>${label}</p><div class="row" role="group" aria-label="自信の度合い">${[1,2,3,4,5].map(n=>`<button data-n="${n}" aria-pressed="false">${n}</button>`).join('')}</div><div class="ends"><span>まったくない</span><span>すごくある</span></div><button class="btn" id="next" disabled>${next}</button>`}
function bindScale(key,onNext){const b=[...app.querySelectorAll('.row button')],nx=$('#next');b.forEach(x=>x.onclick=()=>{b.forEach(y=>y.setAttribute('aria-pressed','false'));x.setAttribute('aria-pressed','true');S[key]=+x.dataset.n;nx.disabled=false});nx.onclick=onNext}
function play(box,list,done){const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;list.forEach((m,k)=>S.timers.push(setTimeout(()=>{box.insertAdjacentHTML('beforeend',bubbles([m]));goEnd(box.lastElementChild);if(k===list.length-1)done()},reduce?0:900+k*1400)))}

function reveal(){
 set(4,`<span class="tag">はじめに</span><h1>その求人、大丈夫？</h1><p>SNSや検索で見つけた求人を見ながら、「応募する／一旦保留する／やめておく」を選んでいくゲームです。闇バイトを見抜けるか、試してみてください。</p><div class="call">怪しいと思ったら、ここに相談<strong>#9110</strong>警察相談専用電話</div><button class="btn" id="go">ゲームをはじめる</button>`);
 $('#go').onclick=conf1}
function conf1(){set(10,`<span class="tag">はじめに</span><h1>あなたは闇バイトを見抜ける自信がある？</h1>${scale('1〜5で選んでね','判別クイズをはじめる')}`);bindScale('c1',()=>quiz(0))}

function quiz(i){S.i=i;const q=Q[i];
 set(12+i*13,`<span class="tag">判別クイズ ${i+1} / ${Q.length}</span><h1>この求人、どうする？</h1>${post(q)}<button class="btn" id="a">応募してみる</button><button class="btn ghost" id="h">一旦保留する</button><button class="btn ghost" id="p">やめておく</button>`);
 $('#a').onclick=()=>answer(true);$('#p').onclick=()=>answer(false);$('#h').onclick=()=>hold(i)}
function hold(i){const q=Q[i];
 if(!q.danger){
  set(15+i*13,`<span class="tag">判別クイズ ${i+1} / ${Q.length}・保留中</span><h1>少し調べてみた。</h1>${post(q)}<div class="res">${esc(q.hold.msg)}</div><h2>${q.hold.ask}</h2><button class="btn" id="a">応募する</button><button class="btn ghost" id="p">応募しない</button>`);
  $('#a').onclick=()=>answer(true,true);$('#p').onclick=()=>answer(false,true);return}
 set(15+i*13,`<span class="tag">判別クイズ ${i+1} / ${Q.length}・保留中</span><h1>保留中にDMが来た。</h1><div class="chat"><div class="head">DM　${esc(q.name)}</div>${bubbles(q.hold.dm.map(t=>({s:'them',t})))}</div><h2>どうする？</h2><button class="btn" id="a">応募する</button><button class="btn ghost" id="p">応募しない</button>`);
 $('#a').onclick=()=>q.dmJudge?dm(i):fall(i);$('#p').onclick=()=>answer(false,true)}
function answer(apply,held){const q=Q[S.i];
 if(q.danger&&apply){dm(S.i);return}
 const right=q.danger!==apply;if(right)S.correct++;S.out[S.i]=right?'ok':'miss';
 const box=document.createElement('div');box.className='res'+(right?'':' bad');
 box.innerHTML=`<b>${right?'○ 正解！':'× 不正解…実はこれ、普通の求人だった。'}</b><br>${esc(q.why)}${held&&q.danger?'<br><br>「今日中に」と急かされても、決める前に家族や友だちに相談していい。':''}${q.dmJudge&&right?'<br><br>この求人は、投稿だけでは見分けにくいように作ってあった。怪しいサインは、応募したあとのDMで初めて出てくる。':''}`;
 app.querySelectorAll('#a,#h,#p').forEach(b=>b.remove());app.appendChild(box);nextBtn()}
function nextBtn(){const nx=document.createElement('button');nx.className='btn';nx.textContent=S.i<Q.length-1?'次の問題へ':'結果へ';nx.onclick=()=>S.i<Q.length-1?quiz(S.i+1):afterQuiz();app.appendChild(nx);nx.focus({preventScroll:true});goEnd(nx)}

function dm(i){const e=Q[i].end;
 set(17+i*13,`<span class="tag">判別クイズ ${i+1}・応募した</span><h1>応募したら、返事が来た。</h1><div class="chat"><div class="head">DM</div><div class="msg me">求人を見ました。応募したいです。</div>${bubbles(e.dm.map(t=>({s:'them',t})))}</div><h2>どうする？</h2><button class="btn" id="y">${esc(e.yes)}</button><button class="btn ghost" id="n">${esc(e.no)}</button>`);
 $('#y').onclick=()=>fall(i);$('#n').onclick=()=>back(i)}
function back(i){const q=Q[i],e=q.end;let head;
 if(q.dmJudge){S.correct++;S.out[i]='dmok';head=`<span class="tag">○ 正解！</span><h1>DMで気づけた！</h1><p>${esc(q.why)}</p><p>応募しても、個人情報を送る前なら間に合う。</p>`}
 else{S.out[i]='back';head=`<span class="tag">危なかった</span><h1>危なかった！</h1><p>これは闇バイトの求人だった。${esc(q.why)}</p><p>応募した時点で、相手にはあなたのアカウントが知られている。個人情報を送る前にやめられたのは、ぎりぎりだった。</p>`}
 set(19+i*13,`${head}<h2>もし「${esc(e.yes)}」を選んでいたら…</h2><div class="chat" id="vid"><div class="head">DM</div></div>`);
 play($('#vid'),e.story,()=>{const f=document.createElement('div');f.className='res bad';f.innerHTML=`<b>あと一歩で、こうなっていた。</b><br>${esc(e.fact)}`;app.appendChild(f);nextBtn()})}
function fall(i){S.out[i]='fell';const e=Q[i].end;
 set(19+i*13,`<div class="stop"><h1>ストップ！</h1><p>危ないよ。このまま進んだら、闇バイトをすることになるよ。</p></div><h2>この先どうなるか（${esc(e.label)}）</h2><div class="chat" id="vid"><div class="head">DM</div></div>`);
 play($('#vid'),e.story,()=>{const f=document.createElement('div');f.className='res bad';f.innerHTML=`<b>これは闇バイトの求人だった。</b><br>${esc(Q[i].why)}<br><br>${esc(e.fact)}`;app.appendChild(f);const t=document.createElement('p');t.className='sub';t.textContent='ゲームはまだ続くよ。';app.appendChild(t);nextBtn()})}

function afterQuiz(){
 if(S.out.every(o=>o==='ok'||o==='dmok')){
  set(76,`<span class="tag">全問正解！</span><h1>もし応募していたら、こうなっていた。</h1><div class="chat" id="vid"><div class="head">テレグラム</div></div>`);
  play($('#vid'),VIDEO,()=>{const b=document.createElement('button');b.className='btn';b.textContent='解説へ';b.onclick=explain;app.appendChild(b);goEnd(b)})}
 else explain()}
function explain(){
 set(80,`<span class="tag">解説</span><h1 class="sm">闇バイトの危ないサイン</h1><ul class="signs mini"><li>「高額」「即日即金」など、楽に稼げることを強調する<small>（警察庁）</small></li><li>シグナルやテレグラムなど、匿名性の高いアプリに誘導する<small>（警察庁）</small></li><li>面接が通話だけで、会社の人に会わない<small>（茨城県警察）</small></li><li>身分証と顔写真を送らせ、脅しに使う<small>（茨城県警察、警視庁）</small></li><li>自分の口座で受け取ったお金を別の口座へ送る「送金代行」は犯罪<small>（イオン銀行、PayPay銀行）</small></li><li>「打ち子募集」など別の募集から誘導される<small>（INTERNET Watch）</small></li><li>「研修なし」の警備など、あるはずの手続きがない。見張りでも強盗と同じ罪になることがある<small>（愛知県警察、警察庁）</small></li></ul><div class="call sm">怪しいと思ったら、<b>最初に見た番号</b>にすぐ相談。家族や友だちに相談するのもOK</div><button class="btn" id="go">次へ</button>`);
 $('#go').onclick=recall}
function recall(){
 set(86,`<span class="tag">覚えてる？</span><h1>最初に見た相談先の番号はどれ？</h1><div class="grid4">${NUMS.map(n=>`<button class="btn ghost" data-n="${n}">${n}</button>`).join('')}</div>`);
 app.querySelectorAll('.grid4 button').forEach(b=>b.onclick=()=>{S.recall=b.dataset.n==='#9110';app.querySelectorAll('.grid4 button').forEach(x=>{x.disabled=true;if(x.dataset.n==='#9110')x.className='btn ok';else if(x===b)x.className='btn ng'});
  const r=document.createElement('div');r.innerHTML=`<div class="call">${S.recall?'正解！':'正解はこっち'}<strong>#9110</strong>警察相談専用電話<br><small class="sub">怪しい求人に応募してしまったときも、ここに相談できる</small></div>`;app.appendChild(r);
  const nx=document.createElement('button');nx.className='btn';nx.textContent='次へ';nx.onclick=conf2;app.appendChild(nx);nx.focus({preventScroll:true});goEnd(nx)})}
function conf2(){const n=S.out.filter(o=>o==='back'||o==='fell'||o==='dmok').length;set(92,`<span class="tag">もう1回</span>${n?`<div class="res bad">あなたは${Q.length}問中<b>${n}問</b>で「応募してみる」を押していた。</div>`:''}<h1>今、あなたは闇バイトを見抜ける自信がある？</h1>${scale('1〜5で選んでね','結果を見る')}`);bindScale('c2',compare)}

function routeText(){return S.out.includes('fell')?'途中で応募→DMでも進んでしまった':S.out.includes('back')?'途中で応募→DMで引き返せた':S.correct===Q.length?'全問正解':'応募はしなかったが、普通の求人を断った'}
function formUrl(){const p=new URLSearchParams({usp:'pp_url'});p.set(ENTRY.c1,S.c1);p.set(ENTRY.c2,S.c2);p.set(ENTRY.route,routeText());p.set(ENTRY.correct,S.correct+'問');p.set(ENTRY.recall,S.recall?'正解した':'まちがえた');return FORM+'?'+p.toString()}
function compare(){
 const lab={dmok:'正解',ok:'正解',miss:'不正解',back:'応募しかけた',fell:'進んでしまった'};
 set(100,`<span class="tag">見比べ</span><h1 class="sm">自信はどう変わった？</h1><div class="cmp sm"><div><div class="lab"><span>ゲーム前の自信</span><span>${S.c1} / 5</span></div><div class="meter"><i style="width:${S.c1*20}%"></i></div></div><div><div class="lab"><span>ゲーム後の自信</span><span>${S.c2} / 5</span></div><div class="meter after"><i style="width:${S.c2*20}%"></i></div></div></div><div class="score sm"><p><b>正解 ${S.correct} / ${Q.length}問</b>　相談先の番号：${S.recall?'覚えていた':'まちがえた'}</p><p class="sub">${S.out.map((o,k)=>`${k+1} ${lab[o]}`).join('／')}</p></div><h2 class="sm">アンケートへのご協力をお願いします！</h2><p class="sm">名古屋市の課題解決の参考にさせてください。</p><div class="res sm">ゲームの結果は自動で入力済みです。<b>変更せずに</b>、残りの質問に答えて送信してください。</div><a class="btn" href="${formUrl()}" target="_blank" rel="noopener" style="display:grid;place-items:center;text-decoration:none">アンケートに答える</a><button class="btn ghost sm" id="again">最初からやり直す</button><div class="note sm">投稿や会社名、DMの内容はすべて架空の例。<details><summary>出典を見る</summary><a href="https://www.npa.go.jp/bureau/safetylife/yamibaito/hanzaishaboshu.html">警察庁「犯罪実行者募集情報の特徴」</a>／<a href="https://www.pref.ibaraki.jp/kenkei/a01_safety/youth/documents/2-3nashi.pdf">茨城県警察 資料</a>／<a href="https://www.keishicho.metro.tokyo.lg.jp/kurashi/drug/yami_arbeit/ban_yamiarbeit.html">警視庁「闇バイトは犯罪です」</a>／<a href="https://www.aeonbank.co.jp/crime/account/">イオン銀行</a>／<a href="https://www.paypay-bank.co.jp/security/buysell.html">PayPay銀行</a>／<a href="https://internet.watch.impress.co.jp/docs/column/netliteracy/2057305.html">INTERNET Watch</a>／<a href="https://www.gov-online.go.jp/npa/202411/video-289986.html">政府広報オンライン</a>／<a href="https://www.pref.aichi.jp/police/shinsei/keibi/documents/2019kyouikujikannkaisei.pdf">愛知県警察（警備員教育）</a>／<a href="https://www.npa.go.jp/hakusyo/r07/honbun/html/bbf112000.html">警察白書（令和7年版）</a>／<a href="https://www.pref.aichi.jp/police/anzen/images/siawaseGireisyuu.pdf">警察庁「闇バイトで人生を棒に振らないために」</a></details></div>`);
 $('#again').onclick=()=>{reset();reveal()}}

reveal();
}
</script>
</body>
</html>
